<!-- ======= Boxers Section ======= -->
<section id="boxers" class="boxers-section fade-in">
  <div class="container">
    <div class="text-center mb-4 mb-md-5">
      <h2 class="mb-2 section-title">Our Boxers</h2>
      <p class="section-subtitle">
        Meet the fighters at SEB's Elite Boxing Gym
      </p>
    </div>

    <!-- Responsive grid: 1 col on mobile, 2 on tablet, 3-4 on desktop -->
    <div class="row justify-content-center g-3 g-md-4">
      <div class="col-12 col-sm-6 col-lg-4 col-xl-3" *ngFor="let boxer of boxers">
        <div class="card h-100 boxer-card glass-card">
          <div class="card-body d-flex flex-column p-3 p-md-4 text-center">

            <div class="boxer-img-wrapper mb-3">
              <img [src]="boxer.image" [alt]="boxer.name" class="img-fluid boxer-img" />
            </div>

            <h5 class="card-title text-white fw-bold mb-1 fs-5">
              {{ boxer.name }}
            </h5>

            <small *ngIf="boxer.nickname" class="text-muted d-block mb-2">
              “{{ boxer.nickname }}”
            </small>

            <p class="card-text fw-semibold mb-1 small text-uppercase" style="color: #d80000">
              {{ boxer.weightClass }}
            </p>

            <p class="card-text text-white-50 small mb-3">
              {{ boxer.record }}
            </p>

            <!-- Social links pinned to bottom -->
            <div class="d-flex justify-content-center align-items-center gap-3 mt-auto pt-2">
              <a
                *ngIf="boxer.instagram"
                [href]="boxer.instagram"
                target="_blank"
                class="social-link"
                aria-label="Instagram"
              >
                <i class="bi bi-instagram"></i>
              </a>
              <a
                *ngIf="boxer.facebook"
                [href]="boxer.facebook"
                target="_blank"
                class="social-link"
                aria-label="Facebook"
              >
                <i class="bi bi-facebook"></i>
              </a>
              <a
                *ngIf="boxer.twitter"
                [href]="boxer.twitter"
                target="_blank"
                class="social-link"
                aria-label="Twitter"
              >
                <i class="bi bi-twitter-x"></i>
              </a>
              <a
                *ngIf="boxer.BoxRec"
                [href]="boxer.BoxRec"
                target="_blank"
                class="social-link boxrec-link"
                aria-label="BoxRec"
              >
                <i class="bi bi-trophy-fill"></i>
                <span>BoxRec</span>
              </a>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</section>
<!-- End Boxers Section -->
